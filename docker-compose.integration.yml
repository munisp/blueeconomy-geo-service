# Integration environment for blueeconomy-geo-service. The service itself is
# NOT composed here — it runs against env-provided PG/Redis/Kafka (see
# GEO_TEST_* below). This compose file provisions disposable dependencies for
# local integration testing; in CI these come from services/containers.
services:
  postgis:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: ${GEO_TEST_PG_PASSWORD:?set GEO_TEST_PG_PASSWORD in the environment}
      POSTGRES_DB: geo_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo -d geo_test"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:59092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "127.0.0.1:59092:9092"
