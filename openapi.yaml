openapi: 3.0.3
info:
  title: blueeconomy-geo-service REST API
  version: 1.0.0
  description: >-
    Sovereign vessel-tracking hot path read model and Tier-0 app-report
    ingest. All coordinates are fixed-point micro-degrees, speeds are
    milli-knots (or millimetres-per-second on app reports) and courses are
    milli-degrees per the geo.*.v1 contracts; floating-point coordinates are
    prohibited. Reads enforce the classification clearance ladder (reader
    clearance >= row classification) and tenant RLS scoping.
    Position plane scoping: the vessel position plane (/vessels* reads,
    ais_positions/latest_positions/vessels_static) is a single shared
    national picture scoped by classification clearance, NOT by tenant —
    those tables carry no tenant column by design. Tenant isolation (RLS)
    governs only the tenant-owned geofence objects (/zones*, geofence
    events); vessel-360 recentZones is read with the caller's tenant bound
    and is empty for tenant-less principals.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - { name: vessels, description: Position plane reads (shared national picture, clearance-scoped) }
  - { name: devices, description: Fleet device plane — provisioning, rotation, telemetry, OTA }
  - { name: fences, description: Tenant geofence zones (v1, maker/checker) }
  - { name: fences-v2, description: Versioned geofences with dwell semantics (WP-10) }
  - { name: density, description: Server-side aggregation and congestion surfaces }
  - { name: stream, description: SSE realtime fan-out (notifications only) }
  - { name: recommendations, description: Shadow-mode ML policy recommendations (Phase 18) }
  - { name: transit, description: GTFS static / GTFS-RT tenant feeds and alerts }
  - { name: MRV, description: IMO DCS / EU MRV monitoring, reporting and verification }
  - { name: safety, description: FSC/PSC inspections and marine casualty investigations }
  - { name: SAR, description: Search-and-rescue incident coordination }
  - { name: status, description: Service status and liveness }
paths:
  /v1/geo/vessels:
    get:
      summary: Latest vessel positions inside a bounding box
      operationId: listVessels
      parameters:
        - name: bbox
          in: query
          description: minLon,minLat,maxLon,maxLat in fixed-point micro-degrees (defaults to whole world)
          schema:
            type: string
            example: "-2000000,2500000,15500000,14500000"
        - name: limit
          in: query
          schema:
            type: integer
            default: 500
            maximum: 5000
      responses:
        '200':
          description: Clearance-filtered latest positions
          content:
            application/json:
              schema:
                type: object
                properties:
                  vessels:
                    type: array
                    items:
                      $ref: '#/components/schemas/VesselSummary'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/geo/vessels/{mmsi}:
    get:
      summary: Vessel-360 (latest position + current static + recent zones)
      operationId: vessel360
      parameters:
        - name: mmsi
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{9}$'
      responses:
        '200':
          description: Vessel-360 view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vessel360'
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /v1/geo/vessels/{mmsi}/track:
    get:
      summary: Track replay as GeoJSON LineString (ST_MakeLine window)
      operationId: vesselTrack
      parameters:
        - name: mmsi
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{9}$'
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: GeoJSON LineString of the clearance-visible track
          content:
            application/geo+json:
              schema:
                type: object
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /v1/geo/zones:
    get:
      summary: List tenant geofence zones (clearance-filtered)
      operationId: listZones
      responses:
        '200':
          description: Tenant zones
          content:
            application/json:
              schema:
                type: object
                properties:
                  zones:
                    type: array
                    items:
                      $ref: '#/components/schemas/Zone'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a geofence zone (maker; persists as draft)
      operationId: createZone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [zoneId, name, classificationFloor, geometry]
              properties:
                zoneId: { type: string }
                name: { type: string }
                classificationFloor:
                  $ref: '#/components/schemas/Classification'
                geometry:
                  type: object
                  description: GeoJSON Polygon (WGS84)
      responses:
        '201':
          description: Draft zone created
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/geo/zones/{id}/approve:
    post:
      summary: Approve a draft zone (checker; maker != checker, four-eyes)
      operationId: approveZone
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Zone approved
        '409':
          description: Maker attempted self-approval or zone not in draft
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/geo/zones/{id}/vessels:
    get:
      summary: Vessels currently inside an approved zone
      operationId: vesselsInZone
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 500, maximum: 5000 }
      responses:
        '200':
          description: Clearance-filtered vessels inside the zone
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/geo/sos:
    get:
      summary: SOS alerts (requires RESTRICTED or higher clearance)
      operationId: listSOS
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 1000 }
      responses:
        '200':
          description: Clearance-filtered SOS alerts
          content:
            application/json:
              schema:
                type: object
                properties:
                  sosAlerts:
                    type: array
                    items:
                      $ref: '#/components/schemas/SOSAlert'
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/geo/sos/{id}/acknowledge:
    post:
      summary: Acknowledge a RAISED SOS alert (geo-sos-reader/geo-admin + RESTRICTED clearance)
      operationId: acknowledgeSOS
      description: >-
        Lifecycle transition RAISED -> ACKNOWLEDGED. The acting principal
        (verified token subject), server timestamp and optional note are
        persisted on the alert ledger and announced as a signed
        geo.sos-acknowledged.v1 envelope (SAFETY priority, RESTRICTED
        floor). Illegal transitions return 409.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$' }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SOSLifecycleRequest'
      responses:
        '200':
          description: Alert acknowledged; returns the updated alert
          content:
            application/json:
              schema:
                type: object
                properties:
                  sosAlert:
                    $ref: '#/components/schemas/SOSAlert'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Illegal lifecycle transition from the current state
  /v1/geo/sos/{id}/resolve:
    post:
      summary: Resolve an SOS alert (geo-sos-reader/geo-admin + RESTRICTED clearance)
      operationId: resolveSOS
      description: >-
        Lifecycle transition RAISED -> RESOLVED or ACKNOWLEDGED -> RESOLVED.
        Actor, timestamp and optional note are persisted and announced as a
        signed geo.sos-resolved.v1 envelope (SAFETY priority, RESTRICTED
        floor). RESOLVED is terminal; further transitions return 409.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$' }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SOSLifecycleRequest'
      responses:
        '200':
          description: Alert resolved; returns the updated alert
          content:
            application/json:
              schema:
                type: object
                properties:
                  sosAlert:
                    $ref: '#/components/schemas/SOSAlert'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Illegal lifecycle transition from the current state
  /v1/geo/app-reports:
    post:
      summary: Tier-0 mobile outbox flush (position report or SOS)
      operationId: flushAppReport
      description: >-
        Idempotent on (reporterId, outboxId): an exact replay returns 200
        with status "idempotent"; a conflicting reuse of an outboxId returns
        409. A payload carrying the `sos` object raises a geo.sos.v1 alert
        (SAFETY priority, RESTRICTED minimum classification).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppReportRequest'
      responses:
        '200':
          description: Accepted or idempotent replay
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: outboxId already used with a different payload
  /v1/geo/berths/recommendation:
    post:
      summary: Shadow-mode berth-allocation policy recommendation (Phase 18)
      operationId: berthRecommendation
      description: >-
        Proxies the ml-stack /score/berth-allocation policy for the given
        port and incoming vessel set and returns the suggested berth
        assignment with mode "shadow" and policyVersion. Advisory only:
        never auto-applied to the berth-slots system of record. Every
        served recommendation is logged to recommendation_log first (the
        future reward signal); a recommendation that cannot be logged is
        not served. Requires ML_STACK_HTTP_URL + ML_STACK_SERVICE_TOKEN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [portCode, vessels]
              properties:
                portCode: { type: string, pattern: '^[A-Z0-9]{2,16}$' }
                vessels:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [mmsi]
                    properties:
                      mmsi: { type: string, pattern: '^[0-9]{9}$' }
                      eta: { type: string, format: date-time }
                      loaMeters: { type: number, minimum: 0 }
                      draftMeters: { type: number, minimum: 0 }
                berths:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [berthId]
                    properties:
                      berthId: { type: string, maxLength: 64 }
                      lengthMeters: { type: number, minimum: 0 }
                      depthMeters: { type: number, minimum: 0 }
                      occupiedUntil: { type: string, format: date-time }
      responses:
        '200':
          description: >-
            Policy suggestion (shadow): {recommendationId, mode, policyVersion,
            suggestion}. Logged under recommendationId for future reward joins.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: >-
            RECOMMENDATION_UNCONFIGURED (scorer not wired), POLICY_UNTRAINED
            (ml-stack 409 passthrough — no promoted policy), SCORING_UNAVAILABLE
            (scorer failure) or RECOMMENDATION_LOG_FAILED (fail-closed reward
            trail).
  /v1/geo/routes/advice:
    post:
      summary: Shadow-mode route-advice policy ranking (Phase 18)
      operationId: routeAdvice
      description: >-
        Proxies the ml-stack /score/route-advice policy and returns route
        options ranked by the policy with mode "shadow" and policyVersion.
        Advisory only; logged before serving exactly like the berth
        recommendation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origin, destination]
              properties:
                origin: { type: string, pattern: '^[A-Z0-9]{2,16}$' }
                destination: { type: string, pattern: '^[A-Z0-9]{2,16}$' }
                vessel:
                  type: object
                  properties:
                    mmsi: { type: string, pattern: '^[0-9]{9}$' }
                    eta: { type: string, format: date-time }
                    loaMeters: { type: number, minimum: 0 }
                    draftMeters: { type: number, minimum: 0 }
                departureTime: { type: string, format: date-time }
      responses:
        '200':
          description: Ranked route options (shadow); logged under recommendationId.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: RECOMMENDATION_UNCONFIGURED / POLICY_UNTRAINED / SCORING_UNAVAILABLE / RECOMMENDATION_LOG_FAILED
  /v1/device-provisioning/requests:
    post:
      tags: [devices]
      summary: Create a device provisioning request (maker)
      description: >-
        Registers a new fleet device as pending; a checker must approve it before the one-time activation se
        cret is issued. Four-eyes: maker != approver.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, ownerAgency, publicKey]
              properties:
                kind: { type: string }
                ownerAgency: { type: string }
                label: { type: string }
                publicKey: { type: string, description: Device Ed25519 public key (base64) }
                metadata: { type: object, additionalProperties: { type: string } }
      responses:
        '201':
          description: Provisioning request created (pending approval).
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: State conflict (illegal lifecycle transition or idempotency conflict)
  /v1/device-provisioning/requests/{id}:
    get:
      tags: [devices]
      summary: Get a provisioning request
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Success.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/device-provisioning/requests/{id}/approve:
    post:
      tags: [devices]
      summary: Approve a provisioning request (checker)
      description: >-
        Issues the one-time activation secret for the approved device. Maker != checker.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Approved; returns the one-time activation secret.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: State conflict (illegal lifecycle transition or idempotency conflict)
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/device-provisioning/requests/{id}/reject:
    post:
      tags: [devices]
      summary: Reject a provisioning request (checker)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Request rejected.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: State conflict (illegal lifecycle transition or idempotency conflict)
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/devices:
    get:
      tags: [devices]
      summary: List registered fleet devices (tenant-scoped)
      responses:
        '200':
          description: Success.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/devices/{id}:
    get:
      tags: [devices]
      summary: Get a device record
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Success.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/devices/{id}/status:
    post:
      tags: [devices]
      summary: Set device administrative status (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, description: e.g. active, suspended, decommissioned }
      responses:
        '200':
          description: Success.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: State conflict (illegal lifecycle transition or idempotency conflict)
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/devices/{id}/rotate:
    post:
      tags: [devices]
      summary: Request device key rotation (maker)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publicKey]
              properties:
                publicKey: { type: string, description: New Ed25519 public key (base64) }
      responses:
        '201':
          description: Rotation request created; old key remains valid for the grace window (GEO_DEVICE_KEY_GRACE, default 24h) after approval.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: State conflict (illegal lifecycle transition or idempotency conflict)
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/devices/{id}/rotate/{requestId}/approve:
    post:
      tags: [devices]
      summary: Approve a key-rotation request (checker)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Rotation approved; grace window starts.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: State conflict (illegal lifecycle transition or idempotency conflict)
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/devices/firmware-releases:
    post:
      tags: [devices]
      summary: Publish a signed firmware release manifest (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, version, artifactSha256, artifactUrl]
              properties:
                kind: { type: string }
                version: { type: string }
                artifactSha256: { type: string }
                artifactUrl: { type: string }
                rolloutPercent: { type: integer, minimum: 0, maximum: 100 }
                minEpoch: { type: integer }
      responses:
        '201':
          description: Firmware release registered; OTA manifests are JWS-EdDSA signed by the service key.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: State conflict (illegal lifecycle transition or idempotency conflict)
  /v1/devices/{id}/telemetry:
    post:
      tags: [devices]
      summary: Ingest device telemetry (device-authenticated)
      description: >-
        Device-authenticated ingest: the device proves identity with its Ed25519 signed envelope, not a plat
        form principal token. Telemetry is validated, deduplicated and folded into the position plane; failu
        res dead-letter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Ed25519-signed device envelope carrying the telemetry payload
      responses:
        '202':
          description: Telemetry accepted for processing.
        '400':
          description: Malformed envelope or payload.
        '401':
          description: Device signature/proof verification failed.
        '409':
          description: Conflicting replay.
  /v1/devices/{id}/firmware:
    get:
      tags: [devices]
      summary: Fetch the signed OTA firmware manifest (device-authenticated)
      description: >-
        Device-authenticated. Returns the current JWS-EdDSA-signed OTA manifest for the device's kind honori
        ng rolloutPercent/minEpoch gating.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Signed firmware manifest.
        '401':
          description: Device authentication failed.
        '404':
          description: No release applicable.
  /v1/devices/mqtt-auth:
    post:
      tags: [devices]
      summary: EMQX MQTT auth hook (device-authenticated)
      description: >-
        EMQX HTTP auth callback: validates the MQTT client's device credential against the fleet registry. F
        ail-closed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clientid: { type: string }
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Auth decision (result allow/deny per EMQX HTTP auth contract).
        '401':
          description: Credential rejected.
  /v1/devices/activate:
    post:
      tags: [devices]
      summary: Activate a provisioned device (one-time secret)
      description: >-
        Exchanges the one-time activation secret from provisioning approval for device activation. No platfo
        rm principal token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, activationSecret]
              properties:
                requestId: { type: string }
                activationSecret: { type: string }
      responses:
        '200':
          description: Device activated.
        '401':
          description: Invalid or consumed activation secret.
        '409':
          description: Already activated.
  /v1/devices/provisioning-requests/{id}:
    get:
      tags: [devices]
      summary: Get a provisioning request (alias under /v1/devices)
      description: >-
        Same resource as /v1/device-provisioning/requests/{id}; kept on a literal prefix to avoid Go ServeMu
        x pattern ambiguity with /v1/devices/{id}/firmware.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Success.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/geo/fences:
    get:
      tags: [fences-v2]
      summary: List versioned geofences (WP-10 fence v2)
      description: >-
        Responses carry provenance {source, asOf, stale, staleNote}.
      responses:
        '200':
          description: Success.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [fences-v2]
      summary: Create a versioned geofence (maker)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [geofenceId, name, classification, verticesMicros]
              properties:
