components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak RS256 JWT with roles, clearance and tenant_id claims
  schemas:
    Classification:
      type: string
      enum: [PUBLIC, INTERNAL, RESTRICTED, CONFIDENTIAL, SECRET]
    VesselSummary:
      type: object
      properties:
        mmsi: { type: string, pattern: '^[0-9]{9}$' }
        vesselRef: { type: string }
        sourceClass:
          type: string
          enum: [AIS, GSM_TRACKER, SAT_TRACKER, APP_REPORT]
        latitudeMicros: { type: integer, format: int32 }
        longitudeMicros: { type: integer, format: int32 }
        speedOverGroundMilliknots: { type: integer, format: int32 }
        courseOverGroundMillidegrees: { type: integer, format: int32 }
        classification: { $ref: '#/components/schemas/Classification' }
        observedAt: { type: string, format: date-time }
        shipName: { type: string }
        shipTypeCode: { type: integer }
    Vessel360:
      type: object
      properties:
        latest: { $ref: '#/components/schemas/VesselSummary' }
        static:
          type: object
          description: Current SCD-2 vessels_static row
        recentZones:
          type: array
          items:
            type: object
    Zone:
      type: object
      properties:
        zoneId: { type: string }
        tenantId: { type: string }
        name: { type: string }
        classificationFloor: { $ref: '#/components/schemas/Classification' }
        state:
          type: string
          enum: [draft, approved]
        makerPrincipalId: { type: string }
        createdAt: { type: string, format: date-time }
        approvedBy: { type: string }
        approvedAt: { type: string, format: date-time }
        geoJson: { type: string, description: Zone geometry as GeoJSON }
    SOSAlert:
      type: object
      properties:
        sosAlertId: { type: string }
        reporterId: { type: string }
        vesselReference: { type: string }
        latitudeMicros: { type: integer, format: int32 }
        longitudeMicros: { type: integer, format: int32 }
        recordedAt: { type: string, format: date-time }
        freeText: { type: string, maxLength: 280 }
        classification: { $ref: '#/components/schemas/Classification' }
        state:
          type: string
          enum: [RAISED, ACKNOWLEDGED, RESOLVED]
          description: >-
            Lifecycle state. Clients must treat only RAISED/ACKNOWLEDGED as
            live; RESOLVED alerts are history.
        receivedAt: { type: string, format: date-time }
        acknowledgedBy:
          type: string
          description: Verified principal subject that acknowledged the alert
        acknowledgedAt: { type: string, format: date-time }
        resolvedBy:
          type: string
          description: Verified principal subject that resolved the alert
        resolvedAt: { type: string, format: date-time }
    SOSLifecycleRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 500
          description: Optional operator note persisted on the lifecycle ledger
    AppReportRequest:
      type: object
      required: [reporterId, vesselReference, latitudeMicros, longitudeMicros, recordedAt, outboxId]
      properties:
        reporterId: { type: string, maxLength: 128 }
        vesselReference: { type: string, maxLength: 128 }
        latitudeMicros: { type: integer, format: int32, minimum: -90000000, maximum: 90000000 }
        longitudeMicros: { type: integer, format: int32, minimum: -180000000, maximum: 180000000 }
        accuracyM: { type: integer, format: int32, minimum: 0 }
        speedMillimetresPerSecond: { type: integer, format: int32, minimum: 0 }
        recordedAt: { type: string, format: date-time, description: Untrusted device clock reading }
        outboxId: { type: string, maxLength: 128 }
        sos:
          type: object
          properties:
            freeText: { type: string, maxLength: 280 }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            type: object
            properties: { error: { type: string } }
    Unauthenticated:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            type: object
            properties: { error: { type: string } }
    Forbidden:
      description: Insufficient role, clearance or tenant binding
      content:
        application/json:
          schema:
            type: object
            properties: { error: { type: string } }
    NotFound:
      description: Resource not found at caller clearance
      content:
        application/json:
          schema:
            type: object
            properties: { error: { type: string } }
